<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="720" viewBox="0 0 1660 720" font-family="Georgia, 'Times New Roman', 'Microsoft YaHei', serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#333"/>
    </marker>
    <style>
      .ttl { font-style: italic; font-weight: bold; font-size: 17px; fill: #111; }
      .bx  { font-size: 14px; fill: #111; font-style: italic; }
      .bxc { font-size: 13px; fill: #111; font-style: italic; }
      .sm  { font-size: 11px; fill: #333; }
      .wt  { font-size: 13px; fill: #fff; font-weight: bold; }
      .ctr { text-anchor: middle; dominant-baseline: middle; }
      .ln  { stroke: #333; stroke-width: 1.7; fill: none; marker-end: url(#ar); }
      .ld  { stroke: #333; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; marker-end: url(#ar); }
    </style>
  </defs>
  <rect width="1660" height="720" fill="#ffffff"/>

  <text x="830" y="38" class="ctr" font-size="27" font-weight="bold" fill="#172333">MiniRainVLM · Single-stream Mixture of Transformers</text>
  <text x="830" y="68" class="ctr" font-size="14" fill="#555">1024 hidden · 20 layers · 8 query heads / 4 KV heads · tied embedding &amp; LM head</text>
  <rect x="270" y="94" width="18" height="12" rx="3" fill="#A9C7E8" stroke="#7FA3CC"/>
  <text x="300" y="104" class="sm">P1: text branch + shared parameters trainable</text>
  <rect x="670" y="94" width="18" height="12" rx="3" fill="#FFF0DD" stroke="#C27B26" stroke-dasharray="3 2"/>
  <text x="700" y="104" class="sm">P1: ConvStem + visual projections / FFN frozen</text>
  <text x="830" y="137" class="ctr" font-size="12" fill="#555">Read bottom → top. Full multimodal architecture shown; P1 runs the text path only.</text>

  <!-- ============ 面板1: 整体流程 ============ -->
  <text x="150" y="192" class="ttl ctr">MiniRainVLM</text>

  <rect x="95" y="610" width="60" height="30" rx="4" fill="#F2A33C"/>
  <text x="125" y="626" class="wt ctr">text</text>
  <rect x="165" y="610" width="82" height="30" rx="4" fill="#FFF0DD" stroke="#C27B26" stroke-dasharray="4 2"/>
  <text x="206" y="626" class="bxc ctr" style="font-size:10px">ConvStem /16</text>
  <text x="206" y="662" class="sm ctr">image pixels</text>
  <line x1="206" y1="650" x2="206" y2="640" class="ln"/>
  <line x1="125" y1="610" x2="140" y2="590" class="ln"/>
  <line x1="195" y1="610" x2="160" y2="590" class="ln"/>

  <rect x="65" y="545" width="170" height="45" rx="6" fill="#FBE9A7" stroke="#D8B84E"/>
  <text x="150" y="562" class="bx ctr">Token Embedding &amp;</text>
  <text x="150" y="579" class="bxc ctr">Patch RMSNorm + Merge</text>
  <line x1="150" y1="545" x2="150" y2="520" class="ln"/>

  <rect x="60" y="380" width="180" height="140" rx="8" fill="#E3CCEF" stroke="#A86CC0" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="150" y="435" class="bx ctr" font-size="15">BlockAttnRes</text>
  <text x="150" y="457" class="bx ctr" font-size="15">Block (Layer k)</text>
  <circle cx="212" cy="492" r="13" fill="none" stroke="#C0392B" stroke-width="2.2"/>
  <text x="212" y="493" class="ctr" font-size="13" fill="#C0392B" font-weight="bold">↻</text>
  <text x="235" y="505" class="ctr" font-size="14" fill="#C0392B" font-weight="bold">×20</text>
  <line x1="150" y1="380" x2="150" y2="362" class="ln"/>

  <rect x="75" y="330" width="150" height="32" rx="5" fill="#C9CED6" stroke="#9AA2AD"/>
  <text x="150" y="347" class="bx ctr">RMSNorm</text>
  <line x1="150" y1="330" x2="150" y2="305" class="ln"/>

  <rect x="75" y="270" width="150" height="32" rx="5" fill="#A9C7E8" stroke="#7FA3CC"/>
  <text x="150" y="287" class="bx ctr">lm_head (tied)</text>
  <line x1="150" y1="270" x2="150" y2="255" class="ln"/>

  <rect x="100" y="222" width="100" height="30" rx="4" fill="#F2A33C"/>
  <text x="150" y="238" class="wt ctr">logits</text>

  <!-- 面板1→2 连接三角 -->
  <polygon points="258,425 300,409 300,441" fill="#C9A6DE" opacity="0.9"/>
  <polygon points="258,462 300,446 300,478" fill="#C9A6DE" opacity="0.9"/>

  <!-- ============ 面板2: Layer k ============ -->
  <text x="435" y="192" class="ttl ctr">Layer k</text>
  <rect x="330" y="200" width="210" height="455" rx="10" fill="#F2E4F8" stroke="#C9A6DE" stroke-width="1.2"/>

  <line x1="400" y1="655" x2="400" y2="620" class="ln"/>

  <rect x="340" y="585" width="120" height="35" rx="6" fill="#FBE9A7" stroke="#D8B84E"/>
  <text x="400" y="603" class="bxc ctr">BlockAttnRes</text>
  <line x1="400" y1="585" x2="400" y2="560" class="ln"/>

  <rect x="340" y="500" width="120" height="60" rx="6" fill="#DDEDD8" stroke="#A9C9A0"/>
  <text x="400" y="524" class="bx ctr">MoT-GQA</text>
  <text x="400" y="543" class="sm ctr" font-size="10">RMSNorm + Attn</text>
  <line x1="400" y1="500" x2="400" y2="455" class="ln"/>

  <rect x="340" y="420" width="120" height="35" rx="6" fill="#FBE9A7" stroke="#D8B84E"/>
  <text x="400" y="438" class="bxc ctr">BlockAttnRes</text>
  <line x1="400" y1="420" x2="400" y2="390" class="ln"/>

  <rect x="340" y="330" width="120" height="60" rx="6" fill="#DDEDD8" stroke="#A9C9A0"/>
  <text x="400" y="348" class="bx ctr">MoT-FFN (c)</text>
  <text x="400" y="366" class="sm ctr" style="font-size:10px">norm_t/v + SwiGLU_t/v</text>
  <text x="400" y="381" class="sm ctr" style="font-size:9px">visual FFN width = text / 2</text>
  <line x1="400" y1="330" x2="400" y2="300" class="ln"/>

  <!-- 块间历史侧注 -->
  <rect x="468" y="440" width="62" height="80" rx="6" fill="#FFF3D6" stroke="#D8B84E" stroke-dasharray="4 3"/>
  <text x="499" y="470" class="sm ctr" font-size="10">块间历史</text>
  <text x="499" y="488" class="sm ctr" font-size="9">嵌入+块尾</text>
  <line x1="468" y1="455" x2="460" y2="440" class="ld"/>
  <line x1="468" y1="505" x2="460" y2="600" class="ld"/>
  <text x="499" y="535" class="sm ctr" style="font-size:9px" fill="#7A5C00">默认每2层 flush</text>

  <text x="435" y="672" class="sm ctr" font-size="10.5">块内经典残差 ｜ 块间可学习聚合</text>

  <!-- ============ 面板3: (a) MoT-GQA ============ -->
  <text x="745" y="192" class="ttl ctr">(a) MoT-GQA</text>
  <rect x="590" y="200" width="310" height="455" rx="10" fill="#EEF7E6" stroke="#BBD8A8" stroke-width="1.2"/>

  <text x="745" y="642" class="sm ctr">Input hidden states [B, T, D]</text>
  <line x1="745" y1="630" x2="745" y2="623" class="ln"/>
  <rect x="640" y="596" width="210" height="27" rx="5" fill="#C9CED6" stroke="#9AA2AD"/>
  <text x="745" y="610" class="bxc ctr">Shared RMSNorm</text>
  <line x1="745" y1="596" x2="745" y2="581" class="ln"/>
  <rect x="615" y="554" width="260" height="27" rx="5" fill="#FBE9A7" stroke="#D8B84E"/>
  <text x="745" y="568" class="bxc ctr" style="font-size:12px">modality: text tokens / visual tokens</text>

  <!-- 与 FFN 一致的双分支着色；模态专属 QKV 参数 -->
  <line x1="669" y1="554" x2="669" y2="537" class="ln"/>
  <line x1="821" y1="554" x2="821" y2="537" class="ln"/>
  <rect x="603" y="478" width="132" height="59" rx="7" fill="#EAF2FC" stroke="#7FA3CC"/>
  <rect x="755" y="478" width="132" height="59" rx="7" fill="#FFF0DD" stroke="#C27B26" stroke-dasharray="5 3"/>
  <text x="669" y="492" class="sm ctr" style="font-size:10px">P1: trainable</text>
  <text x="669" y="511" class="bxc ctr" style="font-size:11px">Wq,t / Wk,t / Wv,t</text>
  <text x="669" y="527" class="sm ctr" style="font-size:10px">Q: 8 heads · K/V: 4</text>
  <text x="821" y="492" class="sm ctr" style="font-size:10px">P1: frozen</text>
  <text x="821" y="511" class="bxc ctr" style="font-size:11px">Wq,v / Wk,v / Wv,v</text>
  <text x="821" y="527" class="sm ctr" style="font-size:10px">Q: 8 heads · K/V: 4</text>

  <line x1="669" y1="478" x2="669" y2="461" class="ln"/>
  <line x1="821" y1="478" x2="821" y2="461" class="ln"/>
  <rect x="615" y="434" width="260" height="27" rx="5" fill="#FBE9A7" stroke="#D8B84E"/>
  <text x="745" y="448" class="bxc ctr" style="font-size:11px">scatter Q / K / V to original token positions</text>
  <line x1="745" y1="434" x2="745" y2="418" class="ln"/>
  <rect x="615" y="391" width="260" height="27" rx="5" fill="#C9CED6" stroke="#9AA2AD"/>
  <text x="745" y="405" class="bxc ctr" style="font-size:11px">Q / K RoPE: text 1D · image 2D</text>
  <line x1="745" y1="391" x2="745" y2="376" class="ln"/>

  <!-- 两种模态进入同一次序列注意力，而非各自独立注意力 -->
  <rect x="603" y="319" width="284" height="57" rx="6" fill="#DDEDD8" stroke="#A9C9A0"/>
  <text x="745" y="332" class="bxc ctr" style="font-size:12px">Joint-sequence GQA</text>
  <text x="745" y="349" class="sm ctr" style="font-size:11px">Softmax(QKᵀ / √d + mask) V</text>
  <text x="745" y="365" class="sm ctr" style="font-size:9px">causal / intra-image bidirectional · decode KV cache</text>

  <path d="M745,319 L745,309 L669,309 L669,292" class="ln"/>
  <path d="M745,309 L821,309 L821,292" class="ln"/>
  <rect x="603" y="263" width="132" height="29" rx="5" fill="#A9C7E8" stroke="#7FA3CC"/>
  <rect x="755" y="263" width="132" height="29" rx="5" fill="#F7D3A6" stroke="#C27B26" stroke-dasharray="5 3"/>
  <text x="669" y="278" class="bxc ctr">W_o,t</text>
  <text x="821" y="278" class="bxc ctr">W_o,v</text>
  <line x1="669" y1="263" x2="669" y2="248" class="ln"/>
  <line x1="821" y1="263" x2="821" y2="248" class="ln"/>
  <rect x="615" y="221" width="260" height="27" rx="5" fill="#FBE9A7" stroke="#D8B84E"/>
  <text x="745" y="235" class="bxc ctr" style="font-size:11px">scatter outputs → outer residual addition</text>
  <text x="745" y="672" class="sm ctr" style="font-size:10px">Separate projections · shared sequence attention</text>

  <!-- ============ 面板4: (b) BlockAttnRes ============ -->
  <text x="1085" y="192" class="ttl ctr">(b) BlockAttnRes</text>
  <rect x="950" y="200" width="270" height="455" rx="10" fill="#F4F4F4" stroke="#CCCCCC" stroke-width="1.2"/>

  <line x1="1082" y1="655" x2="1082" y2="600" class="ln"/>

  <!-- 历史栈 -->
  <rect x="996" y="551" width="160" height="34" rx="5" fill="#FBE9A7" stroke="#D8B84E"/>
  <rect x="1002" y="557" width="160" height="34" rx="5" fill="#FBE9A7" stroke="#D8B84E"/>
  <rect x="1008" y="563" width="160" height="34" rx="5" fill="#FFF8E6" stroke="#D8B84E"/>
  <text x="1088" y="581" class="bxc ctr" font-size="11.5">history + 局部残差</text>
  <text x="1088" y="607" class="sm ctr" style="font-size:9px">flush 将局部残差写入 history</text>

  <line x1="1082" y1="563" x2="1082" y2="530" class="ln"/>

  <rect x="1010" y="500" width="140" height="30" rx="5" fill="#C9CED6" stroke="#9AA2AD"/>
  <text x="1080" y="516" class="bx ctr" font-size="13">RMSNorm</text>

  <!-- query 点积 -->
  <rect x="958" y="445" width="90" height="26" rx="5" fill="#F2A33C"/>
  <text x="1003" y="459" class="wt ctr" font-size="11">query 可学</text>
  <circle cx="1085" cy="458" r="9" fill="#fff" stroke="#333" stroke-width="1.4"/>
  <text x="1085" y="459" class="ctr" font-size="12">·</text>
  <line x1="1080" y1="500" x2="1084" y2="467" class="ln"/>
  <line x1="1048" y1="458" x2="1076" y2="458" class="ln"/>

  <!-- SoftMax α -->
  <rect x="1020" y="395" width="110" height="28" rx="5" fill="#F5A962" stroke="#D98A3E"/>
  <text x="1075" y="410" class="bxc ctr" font-size="12">SoftMax → α</text>
  <line x1="1084" y1="449" x2="1077" y2="423" class="ln"/>

  <!-- Σ 加权 -->
  <circle cx="1070" cy="352" r="12" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="1070" y="353" class="ctr" font-size="13">Σ</text>
  <line x1="1074" y1="395" x2="1071" y2="364" class="ln"/>
  <text x="1100" y="345" class="sm" font-size="10">加权求和</text>

  <!-- V 旁路(未归一化历史) -->
  <path d="M1168,574 L1192,574 L1192,352 L1082,352" class="ln"/>

  <line x1="1070" y1="340" x2="1070" y2="300" class="ln"/>

  <text x="1085" y="630" class="sm ctr" font-size="10">零初始化 → α 均匀 = 均值聚合</text>
  <text x="1085" y="647" class="sm ctr" style="font-size:10px">flush 周期 = block_size / 2（默认2层）</text>

  <!-- ============ 面板5: (c) MoT-FFN ============ -->
  <text x="1450" y="192" class="ttl ctr">(c) MoT-FFN / SwiGLU</text>
  <rect x="1260" y="200" width="380" height="455" rx="10" fill="#F5F0FA" stroke="#C9A6DE" stroke-width="1.2"/>
  <rect x="1275" y="323" width="165" height="262" rx="8" fill="#EAF2FC" stroke="#7FA3CC"/>
  <rect x="1460" y="323" width="165" height="262" rx="8" fill="#FFF0DD" stroke="#C27B26" stroke-dasharray="5 3"/>

  <!-- 输入与模态分流，确定性索引分派而非 top-k 路由 -->
  <text x="1450" y="641" class="sm ctr">Input hidden states [B, T, D]</text>
  <line x1="1450" y1="628" x2="1450" y2="619" class="ln"/>
  <rect x="1310" y="592" width="280" height="27" rx="5" fill="#FBE9A7" stroke="#D8B84E"/>
  <text x="1450" y="606" class="bxc ctr" style="font-size:12px">modality / img_idx: text ↔ image</text>
  <path d="M1357,592 L1357,562" class="ln"/>
  <path d="M1542,592 L1542,562" class="ln"/>

  <!-- 两个专家各有独立 RMSNorm -->
  <rect x="1292" y="535" width="130" height="27" rx="5" fill="#C9CED6" stroke="#9AA2AD"/>
  <text x="1357" y="549" class="bxc ctr">RMSNorm_t</text>
  <rect x="1477" y="535" width="130" height="27" rx="5" fill="#C9CED6" stroke="#C27B26"/>
  <text x="1542" y="549" class="bxc ctr">RMSNorm_v</text>

  <!-- gate / up 两条投影支路 -->
  <path d="M1357,535 L1357,523 L1315,523 L1315,510" class="ln"/>
  <path d="M1357,523 L1398,523 L1398,510" class="ln"/>
  <path d="M1542,535 L1542,523 L1500,523 L1500,510" class="ln"/>
  <path d="M1542,523 L1583,523 L1583,510" class="ln"/>
  <rect x="1282" y="480" width="66" height="30" rx="5" fill="#A9C7E8" stroke="#7FA3CC"/>
  <text x="1315" y="496" class="bxc ctr">W_gate,t</text>
  <rect x="1365" y="480" width="66" height="30" rx="5" fill="#A9C7E8" stroke="#7FA3CC"/>
  <text x="1398" y="496" class="bxc ctr">W_up,t</text>
  <rect x="1467" y="480" width="66" height="30" rx="5" fill="#F7D3A6" stroke="#C27B26"/>
  <text x="1500" y="496" class="bxc ctr">W_gate,v</text>
  <rect x="1550" y="480" width="66" height="30" rx="5" fill="#F7D3A6" stroke="#C27B26"/>
  <text x="1583" y="496" class="bxc ctr">W_up,v</text>

  <line x1="1315" y1="480" x2="1315" y2="462" class="ln"/>
  <line x1="1500" y1="480" x2="1500" y2="462" class="ln"/>
  <rect x="1282" y="438" width="66" height="24" rx="5" fill="#F5A962" stroke="#D98A3E"/>
  <text x="1315" y="451" class="bxc ctr">SiLU</text>
  <rect x="1467" y="438" width="66" height="24" rx="5" fill="#F5A962" stroke="#D98A3E"/>
  <text x="1500" y="451" class="bxc ctr">SiLU</text>

  <!-- 逐元素相乘与下投影 -->
  <circle cx="1357" cy="408" r="12" fill="#fff" stroke="#333" stroke-width="1.4"/>
  <text x="1357" y="409" class="ctr" font-size="16">⊙</text>
  <circle cx="1542" cy="408" r="12" fill="#fff" stroke="#333" stroke-width="1.4"/>
  <text x="1542" y="409" class="ctr" font-size="16">⊙</text>
  <path d="M1315,438 L1315,408 L1345,408" class="ln"/>
  <path d="M1398,480 L1398,408 L1369,408" class="ln"/>
  <path d="M1500,438 L1500,408 L1530,408" class="ln"/>
  <path d="M1583,480 L1583,408 L1554,408" class="ln"/>
  <line x1="1357" y1="396" x2="1357" y2="380" class="ln"/>
  <line x1="1542" y1="396" x2="1542" y2="380" class="ln"/>
  <rect x="1292" y="350" width="130" height="30" rx="5" fill="#A9C7E8" stroke="#7FA3CC"/>
  <text x="1357" y="366" class="bxc ctr">W_down,t</text>
  <rect x="1477" y="350" width="130" height="30" rx="5" fill="#F7D3A6" stroke="#C27B26"/>
  <text x="1542" y="366" class="bxc ctr">W_down,v</text>
  <text x="1357" y="576" class="sm ctr" style="font-size:10px">P1: trainable · H_t = 3264</text>
  <text x="1542" y="576" class="sm ctr" style="font-size:10px">P1: frozen · H_v = 1632</text>

  <!-- 按原位置回填，不是拼接长度或学习门控 -->
  <line x1="1357" y1="350" x2="1357" y2="309" class="ln"/>
  <line x1="1542" y1="350" x2="1542" y2="309" class="ln"/>
  <rect x="1300" y="280" width="300" height="29" rx="5" fill="#FBE9A7" stroke="#D8B84E"/>
  <text x="1450" y="295" class="bxc ctr" style="font-size:12px">scatter back to original token positions</text>
  <line x1="1450" y1="280" x2="1450" y2="256" class="ln"/>
  <text x="1450" y="240" class="sm ctr">Output [B, T, D] → outer residual addition</text>
  <text x="1450" y="218" class="sm ctr" style="font-size:10px">y = W_down ( SiLU(W_gate x) ⊙ W_up x )</text>
  <text x="1450" y="676" class="sm ctr" style="font-size:10px">D = 1024 · H_v = H_t / vision_ffn_scale · FWP off by default</text>

  <!-- ============ 底部标题 ============ -->
  <text x="830" y="702" class="ctr" font-style="italic" font-weight="bold" font-size="21" fill="#111">The Structure of MiniRainVLM</text>
</svg>
