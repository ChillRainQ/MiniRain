[project]
name = "minirain"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "datasets>=5.0.0",
    "matplotlib>=3.11.1",
    "modelscope>=1.38.1",
    "scipy>=1.18.0",
    "swanlab>=0.8.4",
    "transformers>=5.13.0",
    "wandb>=0.28.0",
    "deprecated>=3.0.0",
    "opencc-python-reimplemented>=0.1.7",
    "muon-optimizer",
    "fastparquet>=2026.9.0",
    "torch==2.7.1",
    "torchvision==0.22.1",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
